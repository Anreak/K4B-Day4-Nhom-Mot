# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Yêu cầu người dùng bổ sung thông tin hoặc làm rõ yêu cầu
     trước khi thực hiện hành động.
     response_type=text dùng khi cần người dùng cung cấp
     thêm thông tin hoặc giải thích yêu cầu.
     response_type=choice dùng khi người dùng cần chọn một trong các giá trị được cung cấp.
     response_type=yes_no dùng để xác nhận một hành động
     trước khi thực hiện."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái của một dịch vụ trong một môi trường cụ thể.
     environment chỉ nhận các giá trị:
    - production
    - staging
     Không tự động ánh xạ các từ như demo, test, QA, dev
     thành production hoặc staging.
     Nếu người dùng sử dụng một tên môi trường không thuộc các giá trị
     trên hoặc môi trường chưa rõ ràng, cần yêu cầu người dùng chọn
     production hoặc staging trước khi gọi tool."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra tình trạng thiết bị dựa trên asset ID.

     asset_id phải là mã tài sản cụ thể, ví dụ LT-204 hoặc DT-031.

     Không được sử dụng các mô tả chung như laptop, máy của tôi
     hoặc máy tính của tôi làm asset_id.

     Nếu người dùng yêu cầu kiểm tra thiết bị nhưng chưa cung cấp
     asset ID cụ thể, không được tự đoán hoặc tự tạo asset ID.
     Cần yêu cầu người dùng cung cấp asset ID.

     Luôn xác định rõ giá trị check khi gọi tool.

     VPN tương ứng với check=vpn.
     Wi-Fi, network hoặc connectivity tương ứng với check=network.
     Security, antivirus hoặc encryption tương ứng với check=security.
     Hardware, battery, disk hoặc memory tương ứng với check=hardware.
     Software hoặc application tương ứng với check=software.
     Kiểm tra tổng thể hoặc toàn bộ tương ứng với check=all.
     Khi người dùng yêu cầu một loại kiểm tra cụ thể,
     không được dùng check=all."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên bằng employee ID.
     employee_id phải là mã nhân viên cụ thể, ví dụ EMP-1003.
     Không sử dụng tên phòng ban, chức vụ, tên người hoặc mô tả như: Sales, Operations, nhân viên bên Sales làm employee_id.
     Nếu người dùng chưa cung cấp employee ID cụ thể,cần yêu cầu người dùng cung cấp thêm thông tin thay vì tự đoán.
     Kết quả có thể chứa assigned_assets là các thiết bị được cấp cho nhân viên. 
     Không tự động gọi inspect_device chỉ vì kết quả có assigned_assets. 
     Chỉ gọi inspect_device khi người dùng thực sự yêu cầu kiểm tra, chẩn đoán hoặc xem trạng thái của thiết bị."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ sau khi người dùng đã xác nhận rõ ràng payload hiện tại. Đây là write action. Quy trình bắt buộc: trước tiên chỉ gọi clarify với response_type=yes_no để hỏi xác nhận; không gọi tool này trong cùng lượt hỏi xác nhận, không gọi với confirmed=false để thăm dò, và không gọi với confirmed=true trước khi người dùng trả lời đồng ý. Nếu summary, priority hoặc asset_id thay đổi thì phải hỏi xác nhận lại. Nếu người dùng chỉ yêu cầu xem lại hoặc hỏi xác nhận, không gọi tool này."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, description: "Phải là true chỉ khi người dùng đã xác nhận rõ ràng đúng payload hiện tại; không gọi tool để hỏi xác nhận"}
      required: [summary]
